<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Runner — Lädt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header" data-od-id="app-header">
    <div class="app-header__inner">
      <span class="wordmark" data-od-id="wordmark">Job Runner</span>
      <div class="poll-indicator" data-od-id="poll-indicator">
        <span class="poll-indicator__text">
          <span class="poll-indicator__dot poll-indicator__dot--wait" aria-hidden="true"></span>
          Lädt …
        </span>
        <button class="refresh-btn" type="button" aria-label="Jetzt aktualisieren" title="Jetzt aktualisieren" data-od-id="refresh-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V5h-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page" data-od-id="page-main">
    <div class="container">
      <div class="page-main">

        <form class="job-form" id="job-form" novalidate data-od-id="job-form">
          <div class="field">
            <label class="field__label" for="job-text">Text</label>
            <textarea class="field__control" id="job-text" name="text" placeholder="Text eingeben, der ausgewertet werden soll …"></textarea>
          </div>
          <div class="field">
            <label class="field__label" for="job-analysis">Auswertung</label>
            <select class="field__control" id="job-analysis" name="analysis">
              <option value="word_count">Wortanzahl</option>
              <option value="top_words">Häufigste Wörter</option>
              <option value="reading_time">Lesezeit</option>
            </select>
          </div>
          <div class="job-form__actions">
            <button class="btn btn--primary" type="submit" data-od-id="submit-btn">Auftrag erstellen</button>
          </div>
        </form>

        <section class="job-list" aria-label="Aufträge werden geladen" aria-busy="true" data-od-id="job-list-skeleton">
          <div class="skeleton-card">
            <div class="skeleton-bar" style="width:40%"></div>
            <div class="skeleton-bar" style="width:90%;height:14px"></div>
            <div class="skeleton-bar" style="width:70%;height:14px"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-bar" style="width:34%"></div>
            <div class="skeleton-bar" style="width:84%;height:14px"></div>
            <div class="skeleton-bar" style="width:62%;height:14px"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-bar" style="width:38%"></div>
            <div class="skeleton-bar" style="width:88%;height:14px"></div>
            <div class="skeleton-bar" style="width:74%;height:14px"></div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <footer class="mock-nav">
    <div class="mock-nav__inner">
      <span class="mock-nav__label">Mockup screens</span>
      <a href="index.html">Übersicht</a>
      <a href="empty.html">Leerzustand</a>
      <a href="api-unreachable.html">API nicht erreichbar</a>
      <a href="validation.html">Validierung</a>
      <a class="is-current" href="skeleton.html">Skeleton</a>
    </div>
  </footer>
</body>
</html>

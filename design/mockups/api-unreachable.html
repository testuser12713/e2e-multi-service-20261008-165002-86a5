<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Runner — API nicht erreichbar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header" data-od-id="app-header">
    <div class="app-header__inner">
      <span class="wordmark" data-od-id="wordmark">Job Runner</span>
      <div class="poll-indicator" data-od-id="poll-indicator">
        <span class="poll-indicator__text">
          <span class="poll-indicator__dot poll-indicator__dot--wait" aria-hidden="true"></span>
          Verbinde neu …
        </span>
        <button class="refresh-btn" type="button" aria-label="Jetzt aktualisieren" title="Jetzt aktualisieren" data-od-id="refresh-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V5h-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page" data-od-id="page-main">
    <div class="container">
      <div class="page-main">

        <form class="job-form" id="job-form" novalidate data-od-id="job-form">
          <div class="field" id="text-field">
            <label class="field__label" for="job-text">Text</label>
            <textarea class="field__control" id="job-text" name="text" placeholder="Text eingeben, der ausgewertet werden soll …"></textarea>
            <p class="field__error" id="job-text-error" hidden>
              <svg class="field__error-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 1.8 14.2 13H1.8L8 1.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M8 6.2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="8" cy="11.4" r="0.75" fill="currentColor"/>
              </svg>
              <span>Text darf nicht leer sein.</span>
            </p>
          </div>

          <div class="field">
            <label class="field__label" for="job-analysis">Auswertung</label>
            <select class="field__control" id="job-analysis" name="analysis">
              <option value="word_count">Wortanzahl</option>
              <option value="top_words">Häufigste Wörter</option>
              <option value="reading_time">Lesezeit</option>
            </select>
          </div>

          <div class="job-form__actions">
            <button class="btn btn--primary" type="submit" id="submit-btn" data-od-id="submit-btn">Auftrag erstellen</button>
          </div>
        </form>

        <div class="error-banner" id="error-banner" role="alert" data-od-id="error-banner">
          <svg class="error-banner__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.8 14.2 13H1.8L8 1.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8 6.2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="11.4" r="0.75" fill="currentColor"/>
          </svg>
          <div class="error-banner__content">
            API nicht erreichbar unter <span style="font-family:var(--font-mono)">http://localhost:8000</span>. Erneuter Versuch alle 3 s.
          </div>
          <div class="error-banner__actions">
            <button class="btn btn--secondary btn--sm" type="button" data-od-id="retry-btn">Erneut versuchen</button>
            <button class="error-banner__dismiss" type="button" aria-label="Hinweis schließen" data-od-id="dismiss-btn">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="mock-nav">
    <div class="mock-nav__inner">
      <span class="mock-nav__label">Mockup screens</span>
      <a href="index.html">Übersicht</a>
      <a href="empty.html">Leerzustand</a>
      <a class="is-current" href="api-unreachable.html">API nicht erreichbar</a>
      <a href="validation.html">Validierung</a>
      <a href="skeleton.html">Skeleton</a>
    </div>
  </footer>

  <script>
    (function () {
      var banner = document.getElementById('error-banner');
      var dismissBtn = document.getElementById('dismiss-btn');
      dismissBtn.addEventListener('click', function () {
        banner.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
